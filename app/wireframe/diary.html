<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartMeal · Nhật ký · Chưa phê duyệt</title><style>
@import url('https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fff;color:#36302b;font:14px/1.45 Arimo,Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible{outline:2px solid #718b43;outline-offset:2px}.review{max-width:600px;margin:18px auto;padding:0 12px}.review label{display:block;margin:10px 0}.phone{width:390px;max-width:100%;height:800px;border:1px solid #bbb;margin:12px auto;display:flex;flex-direction:column;background:#fff;overflow:hidden;position:relative}.scroll{overflow:auto;flex:1;min-height:0;scrollbar-width:thin}.calendar{background:linear-gradient(#fffaf0,#fafbef);padding:12px 12px 16px;border-radius:0 0 26px 26px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal-head strong{font-size:22px;color:#70492d}.cal-head button{border:0;background:transparent;color:#70492d;font-size:24px;min-width:40px;min-height:40px}.week{display:flex;gap:0;justify-content:space-between}.day{flex:1;min-width:0;text-align:center;border:0;background:transparent;color:#684a34;padding:7px 0;border-radius:30px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px}.day .date{width:37px;height:37px;border:2px solid #edf2df;outline:2px solid #fff;outline-offset:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}.day.current{background:#eeeade}.day.selected .date{border-color:#bad28c}.day .marker{font-size:15px;height:16px}.sample-note{font-size:11px;letter-spacing:.2px;text-align:center;margin:9px 0;color:#78624b}.summary,.history{margin:28px 14px 16px;background:white;border:1px solid #eee;border-radius:22px;padding:18px;box-shadow:0 2px 7px #00000005}.summary{position:relative;padding-top:38px}.rabbit{position:absolute;top:-27px;left:calc(50% - 32px);width:64px;height:53px;object-fit:contain}.totals{display:flex;align-items:center;justify-content:space-between;gap:8px}.stat{text-align:center;flex:1;font-size:14px}.stat b{display:block;font-size:25px;margin:7px 0}.stat.main b{color:#7e9f38}.stat.snack b{color:#c45c78}.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}.main .swatch{background:#afce6a}.snack .swatch{background:#f3a5b1}.ring{width:130px;height:130px;border-radius:50%;padding:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#eee}.ring-inside{background:white;border-radius:50%;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:34px;font-weight:700;color:#678039}.ring span{font-size:12px}.unknown{margin-top:8px;text-align:center;font-size:12px}.nutrients{border-top:1px solid #eee;margin-top:18px;padding-top:12px}.nutrients h3{font-size:13px;margin:0 0 12px;font-weight:400}.nutrient-row{display:flex;gap:10px}.nutrient-row div{flex:1;font-size:11px;color:#8b8179}.nutrient-row b{display:block;font-size:12px;font-weight:400;margin-bottom:5px}.history{padding:0 0 14px;overflow:hidden;margin-top:14px}.history>h2{font-size:19px;margin:0;padding:16px 18px 8px}.meal-section{padding:12px 18px 2px}.meal-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}.meal-title strong{font-size:18px;text-decoration:underline;text-decoration-color:#d2e799;text-decoration-thickness:6px;text-underline-offset:-3px}.meal-title small{margin-left:auto;color:#81756b;font-size:11px}.category-icon{display:inline-block;width:34px;height:32px;background-image:url('assets/diary-swipe.jpg');background-size:384px 682.8px;flex-shrink:0}.breakfast{background-position:-32px -610px}.lunch{background-position:-108px -610px}.dinner{background-position:-182px -610px}.snack-icon{background-position:-257px -610px}.occasion{position:relative;margin:3px 0 8px;overflow:hidden;border-radius:15px;background:#ffa5af}.occasion-card{position:relative;background:#fff;border-radius:15px;padding:7px 2px;z-index:1;transition:transform .15s;touch-action:pan-y}.occasion.swiped .occasion-card{transform:translateX(-59px)}.occasion-meta{font-size:11px;color:#96877a;margin:2px 0 7px;display:flex;justify-content:space-between;gap:5px}.edit{background:transparent;border:0;text-decoration:underline;color:#806e5e;font-size:11px;padding:0 5px}.food{display:flex;align-items:center;gap:12px;padding:7px 0;border:0;background:transparent;text-align:left;width:100%;color:#39312a}.thumbnail{width:54px;height:54px;border:1px dashed #c9c1b9;border-radius:8px;background:#f7f6f4;color:#9b8a7a;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;flex-shrink:0}.food-info{flex:1;min-width:0}.food-title{font-size:16px;font-weight:700}.food small{display:block;font-size:11px;color:#9a8e82;margin-top:4px}.chevron{font-size:25px;color:#d9d6d3}.combo-parts{font-size:11px;color:#897c70;margin:0 0 5px 66px}.delete{position:absolute;right:0;top:0;bottom:0;width:58px;border:0;background:#ffa5af;color:#793443;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px}.trash{width:33px;height:43px;background-image:url('assets/diary-swipe.jpg');background-size:384px 682.8px;background-position:-319px -267px}.empty{padding:35px 16px;text-align:center;color:#88776a}.meal-categories{display:flex;justify-content:space-around;padding:10px 14px 16px;background:white;gap:10px}.meal-categories button{border:0;border-radius:34px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 10px;font-size:12px;color:#4f4134}.meal-categories button.selected{background:#ffe3e7}.meal-categories .category-icon{height:34px}.nav{display:flex;gap:8px;padding:6px 13px 4px;background:#f4f3f8;align-items:stretch;flex-shrink:0;height:66px}.pill{display:flex;flex:1;min-width:0;border:2px solid #fff;border-radius:40px;background:#fff;padding:2px}.nav button{font:11px/1.2 Arimo,Arial,sans-serif;color:#b6a18a;min-width:0;border:0;flex:1;padding:3px 1px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav [aria-current=page]{border-radius:30px;background:#eeeae7;color:#624329}.icon-pending{height:23px;font-size:10px;border:1px dashed #c7b49e;display:flex;align-items:center;padding:0 3px}.nav .ai{background:#59bf64;border-radius:50%;flex:0 0 58px;color:#fff}.ai-image{width:27px;height:26px;background-image:url('assets/home.png');background-size:360px 640px;background-position:-302px -597px}.modal-layer{position:absolute;inset:0;z-index:100;isolation:isolate;padding:max(12px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom));background:#0006;display:flex;align-items:center;justify-content:center}.modal{width:90%;background:white;border:1px solid #bba;border-radius:18px;padding:20px}.modal h3{margin:0 0 16px;font-size:18px}.modal button{padding:8px;margin:10px 5px 0 0;border:1px solid #c5beb5;background:#faf8f2;border-radius:8px}.detail{position:absolute;inset:0;background:#fff;padding:20px}.detail button{border:1px solid #bbb;background:white;padding:8px}.pending{border:1px dashed #bbb;padding:20px;margin-top:20px;color:#847365}.phone.full{height:auto;min-height:800px}.phone.full .scroll{overflow:visible}.board{width:2550px;padding:30px}.board-grid{display:grid;grid-template-columns:repeat(6,390px);gap:30px;align-items:start}.board-item>h2{font-size:16px}.board-item>p{font-size:13px;max-width:390px}.board-item .phone{margin:0}.board>.flows{margin-top:40px;font-size:18px;line-height:2}.board-item .calendar .day{pointer-events:none}[hidden]{display:none!important}@media(max-width:400px){.phone{width:100%;border-left:0;border-right:0}.ring{width:120px;height:120px}.summary{padding-left:12px;padding-right:12px}.stat{font-size:12px}.day .date{width:33px;height:33px}.meal-categories{gap:3px}.meal-categories button{padding:8px}}
</style><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script></head><body><div class="review"><b>NHẬT KÝ · BẢN NHÁP / CHƯA PHÊ DUYỆT</b><label>Trạng thái dữ liệu mẫu <select id="state"><option value="current">Có bữa chính và ăn nhẹ</option><option value="multiple">Ba món trong cùng một lần lưu</option><option value="empty">Chưa ghi bữa ăn</option><option value="swipe">Vuốt trái để xóa</option><option value="deleted">Sau khi xóa món cuối của một đợt</option><option value="ambiguous">Loại bữa cần làm rõ</option></select></label><div id="annotation">Màu xanh / hồng là tạm chọn. Món, ảnh và thời gian đều là dữ liệu mẫu; nhóm chất chưa có dữ liệu đối chiếu.</div></div><div id="app"></div><script src="diary-model.js"></script><script src="meal-update-model.js"></script><script>
const app=document.getElementById('app');let state='current',selectedDate='2026-09-20',weekShift=0,savedScroll=0,customRows=null,pendingId=null,suppressClick=false;
function dayISO(n){return new Date(Date.UTC(2026,8,n)).toISOString().slice(0,10);}
function getRows(){return customRows||SmartMealDiary.records(state);}
const labels=['T2','T3','T4','T5','T6','T7','CN'];
function calendar(home=false){return '<div class="calendar"><div class="cal-head"><button data-action="prev" aria-label="Tuần trước">‹</button><strong>'+ (weekShift===0?'Hôm nay':'[Tuần khác]') +' <span style="font-size:13px">▾</span></strong><button data-action="next" aria-label="Tuần sau">›</button></div><div class="week">'+labels.map((label,i)=>{const n=14+i+weekShift*7;const date=dayISO(n);const displayDay=Number(date.slice(-2));return '<'+(home?'div':'button')+' class="day '+(n===20?'current ':'')+(selectedDate===date?'selected':'')+'" '+(!home?'data-action="date" data-date="'+date+'"':'')+'><span>'+label+'</span><span class="date">'+(n===20?'Nay':displayDay)+'</span>'+(home?'<span class="marker">[Dữ liệu]</span>':'')+'</'+(home?'div':'button')+'>';}).join('')+'</div></div>';}
function nav(){return '<nav class="nav" aria-label="Điều hướng chính"><div class="pill">'+['Hồ sơ','Nhật ký','Sổ tay','Ghi lại'].map(n=>'<button data-action="nav" data-name="'+n+'" '+(n==='Nhật ký'?'aria-current="page"':'')+'><span class="icon-pending">[Icon]</span><span>'+n+'</span></button>').join('')+'</div><button class="ai" data-action="nav" data-name="AI"><span class="ai-image"></span><span>AI</span></button></nav>';}
function eatenRows(r,i){return '<div class="occasion-meta"><span>'+(r.time?r.time+' · ':'')+(r.section||'Chưa xác định bữa')+' · mẫu</span></div>'+r.items.map((d,j)=>'<div class="occasion '+(state==='swipe'&&i===1&&j===1?'swiped':'')+'" data-id="'+d.id+'" data-generated-at="'+(d.generatedAt||'')+'" data-recommendation-id="'+(d.recommendationId||'')+'"><button class="delete" data-action="delete" data-id="'+d.id+'" aria-label="Xóa '+d.title+'"><span class="trash"></span>Xóa</button><div class="occasion-card"><button class="food" data-action="detail" data-id="'+d.id+'" data-recipe="'+d.recipeId+'"><span class="thumbnail">[Ảnh món]</span><span class="food-info"><span class="food-title">'+d.title+'</span><small>Đã xác nhận ăn · mẫu</small></span><span class="chevron">›</span></button>'+(d.components?'<div class="combo-parts">[Các món thành phần của combo]</div>':'')+'</div></div>').join('');}
function render(){const rows=getRows().filter(r=>r.date===selectedDate);const c=SmartMealDiary.count(rows,selectedDate);const end=c.total?360*c.main/c.total:0;const end2=c.total?360*(c.main+c.snack)/c.total:0;app.innerHTML='<div class="phone"><div class="scroll">'+calendar()+'<div class="sample-note">DỮ LIỆU MẪU · CHƯA PHÊ DUYỆT</div><section class="summary"><img class="rabbit" src="assets/rabbit.png" alt="Bạn Thỏ đã duyệt"><div class="totals"><div class="stat main"><span class="swatch"></span>Bữa chính<b>'+c.main+'</b><small>đợt</small></div><div class="ring" style="background:conic-gradient(var(--sm-green,#CFE6AF) 0deg '+end+'deg,var(--sm-yellow,#FFF0B0) '+end+'deg '+end2+'deg,#eee '+end2+'deg 360deg)"><div class="ring-inside"><b>'+c.total+'</b><span>đợt đã lưu</span></div></div><div class="stat snack"><span class="swatch"></span>Ăn nhẹ<b>'+c.snack+'</b><small>đợt</small></div></div>'+(c.unknown?'<div class="unknown">Cần làm rõ loại bữa: '+c.unknown+' đợt</div>':'')+'<div class="nutrients"><h3>Các món đã ăn cung cấp những nhóm chất nào?</h3><div class="nutrient-row">'+[1,2,3].map(()=>'<div><b>[Nhóm chất]</b>Chưa có dữ liệu đối chiếu</div>').join('')+'</div></div></section><section class="history"><h2>Bữa ăn đã ghi nhận</h2>'+(!rows.length?'<div class="empty">Chưa ghi nhận bữa ăn</div>':rows.map((r,i)=>'<section class="meal-section" id="meal-'+r.id+'"><div class="meal-title"><span class="category-icon '+(r.section==='Bữa sáng'?'breakfast':r.section==='Bữa trưa'?'lunch':r.section==='Bữa tối'?'dinner':r.section==='Ăn nhẹ'?'snack-icon':'pending-slot')+'"></span><strong>'+r.section+'</strong><small>1 đợt</small></div>'+eatenRows(r,i)+'</section>').join(''))+'</section><div class="meal-categories" aria-label="Nhóm bữa ăn">'+[['Bữa sáng','breakfast'],['Bữa trưa','lunch'],['Bữa tối','dinner'],['Ăn nhẹ','snack-icon']].map(([n,cl])=>'<button data-action="category" data-name="'+n+'" class="'+(rows.some(r=>r.section===n)?'selected':'')+'"><span class="category-icon '+cl+'"></span>'+n+'</button>').join('')+'</div></div>'+nav()+'</div>';wireSwipes();}
function wireSwipes(){document.querySelectorAll('.occasion-card').forEach(el=>{let x=0;el.onpointerdown=e=>x=e.clientX;el.onpointerup=e=>{if(Math.abs(x-e.clientX)>35){suppressClick=true;el.parentElement.classList.toggle('swiped',x>e.clientX);setTimeout(()=>suppressClick=false,300);}};});}
document.getElementById('state').onchange=e=>{state=e.target.value;customRows=null;selectedDate='2026-09-20';weekShift=0;render();if(state==='multiple')document.getElementById('meal-save-02')?.scrollIntoView({block:'center'});};
let modalScroll=0;
app.addEventListener('keydown',e=>{const m=app.querySelector('.modal-layer');if(!m)return;if(e.key==='Escape')m.querySelector('[data-action=cancel]').click();if(e.key==='Tab'){e.preventDefault();const bs=[...m.querySelectorAll('button')];const i=bs.indexOf(document.activeElement);bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus();}});
app.addEventListener('click',e=>{if(suppressClick)return;const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='prev'||a==='next'){weekShift+=a==='prev'?-1:1;selectedDate=dayISO(20+weekShift*7);render();}if(a==='date'){selectedDate=b.dataset.date;render();}if(a==='nav'){if(window.parent!==window)window.parent.postMessage({type:'smartmeal-nav',name:b.dataset.name},location.origin);document.getElementById('annotation').textContent='Đi tới '+b.dataset.name+' trong bộ wireframe hiện có. Các màn hình ngoài phạm vi được giữ nguyên.';}if(a==='category'){const rec=getRows().find(r=>r.section===b.dataset.name);if(rec)document.getElementById('meal-'+rec.id)?.scrollIntoView({block:'center'});}if(a==='detail'){savedScroll=app.querySelector('.scroll').scrollTop;window.parent.postMessage({type:'smartmeal-detail',id:b.dataset.recipe,date:selectedDate,weekShift,scroll:savedScroll},'*');}if(a==='back-detail'){app.querySelector('.detail').remove();app.querySelector('.scroll').scrollTop=savedScroll;}if(a==='delete'){modalScroll=app.querySelector('.scroll').scrollTop;pendingId=b.dataset.id;const layer=document.createElement('div');layer.className='modal-layer';layer.innerHTML='<div class="modal"><h3>Xóa món đã ăn?</h3><div>Chỉ xóa món đang chọn khỏi Nhật ký. Các món khác và Sổ tay được giữ nguyên.</div><button data-action="cancel">Hủy</button><button data-action="confirm-delete">Xóa</button></div>';app.querySelector('.phone').append(layer);layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-label','Xóa món đã ăn?');app.querySelector('.scroll').inert=true;app.querySelector('.nav').inert=true;layer.querySelector('button').focus();}if(a==='cancel'){app.querySelector('.modal-layer').remove();app.querySelector('.scroll').inert=false;app.querySelector('.nav').inert=false;app.querySelector('.scroll').scrollTop=modalScroll;app.querySelector('[data-action=delete][data-id="'+pendingId+'"]')?.focus({preventScroll:true});}if(a==='confirm-delete'){customRows=MealUpdate.removeDish(getRows(),pendingId);window.parent.postMessage({type:'smartmeal-rows',rows:customRows,date:selectedDate},'*');pendingId=null;render();app.querySelector('.scroll').scrollTop=modalScroll;}});
if(new URLSearchParams(location.search).has('embedded')){document.querySelector('.review').style.cssText='font-size:11px;margin:8px;padding:0 8px';const style=document.createElement('style');style.textContent='.phone{border:0;margin:0;width:100%;height:calc(100vh - 105px)}.review>b{display:none}.review label{margin:2px 0}#annotation{font-size:10px}';document.head.append(style);}render();window.SmartMealPreview={render,setState(s){state=s;customRows=null;selectedDate='2026-09-20';weekShift=0;render();},calendar};
</script><script>if(new URLSearchParams(location.search).has("panel")){const s=document.createElement("style");s.textContent=".review{display:none}.phone{margin:0;border:0;height:800px}";document.head.append(s);}</script></body></html>
